name: IMM OS Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r requirements.txt

      - name: Lint — errors only (fail build)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style warnings (informational)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest
    services:
      # time_service delay-queue tests talk to a real Redis (REDIS_URL default localhost:6379)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # Inventory integration tests run against the real schema (imm-os-infra init.sql)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: imm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d imm_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v3

      - name: Fetch infra schema (same-named branch if it exists, else main)
        run: |
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          url=https://github.com/IndiaMoonMars/imm-os-infra.git
          git ls-remote --exit-code --heads "$url" "$ref" >/dev/null || ref=main
          echo "Using imm-os-infra@$ref"
          git clone --depth 1 --branch "$ref" "$url" ../imm-os-infra

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          IMM_TEST_DATABASE_URL: postgresql://admin:changeme@127.0.0.1:5432/imm_db
          IMM_INIT_SQL: ../imm-os-infra/postgres/init.sql
        run: |
          pytest tests/ -v --tb=short

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t imm-os-backend:${{ github.sha }} .
          docker tag imm-os-backend:${{ github.sha }} imm-os-backend:latest

      - name: Smoke test container
        run: |
          docker run -d --name imm-backend-smoke -p 8000:8000 imm-os-backend:latest
          sleep 4
          curl -f http://localhost:8000/health
          docker stop imm-backend-smoke
          docker rm imm-backend-smoke

  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-latest
    # Only publish on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/indiamoonmars/imm-os-backend:latest
            ghcr.io/indiamoonmars/imm-os-backend:${{ github.sha }}
